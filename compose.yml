services:
  yt-indexarr:
    image: ghcr.io/fosserglitch902/yt-indexarr:latest
    container_name: yt-indexarr
    restart: unless-stopped
    ports:
      - "9117:9117"   # Torznab indexer
      - "9177:9177"   # qBittorrent download spoofer
    volumes:
      - yt-indexarr-data:/data   # downloads (default /data/downloads)
    environment:
      # --- indexer (indexer.py) ---
      - YT_INDEXER_HOST=0.0.0.0
      - YT_INDEXER_PORT=9117
      - YT_INDEXER_API_KEY=youtubeindexer
      - YT_INDEXER_REQUIRE_KEY=0
      - YT_INDEXER_INDEXER_NAME=YouTube
      - YT_INDEXER_BASE_URL=http://localhost:9117
      # - YT_INDEXER_SCRIPT=/app/yt-episode-search.sh
      # - YT_INDEXER_FALLBACK_QUERY=tv episode
      # - YT_INDEXER_LOG_LEVEL=INFO
      # --- search script (yt-episode-search.sh) ---
      # - MIN_DURATION=300
      # - RESOLVE_TOP=5
      # - PLAYER_CLIENT=tv_embedded,android_vr,web,tv_simply,android
      - POT_PROVIDER=http://pot:4416
      # --- download spoofer (qbt.py) ---
      - YT_QBT_HOST=0.0.0.0
      - YT_QBT_PORT=9177
      - YT_QBT_USERNAME=admin
      - YT_QBT_PASSWORD=change-me
      - YT_QBT_REQUIRE_AUTH=0
      - YT_QBT_DL_DIR=/data/downloads
      # - YT_CODEC=auto|av1|vp9|h264   # video codec for downloads + size estimate (default auto)
      # - YT_QBT_YTDLP=yt-dlp
      # - YT_QBT_PLAYER_CLIENT=tv_embedded,android_vr,web,tv_simply,android
      - YT_QBT_POT_PROVIDER=http://pot:4416
      # - YT_QBT_LOG_LEVEL=INFO
      # --- episode-title lookup: TVMaze ---
      # - TVMAZE_API=https://api.tvmaze.com
      # - TVMAZE_TIMEOUT=5
      # - TVMAZE_CACHE_FILE=/data/cache/tvmaze.json
      # - TVMAZE_CACHE_TTL=604800
      # --- episode-title lookup: TheTVDB (localized titles) ---
      # - TVDB_API_KEY=your-thetvdb-key
      # - TVDB_PIN=your-pin   # only for user-supported keys
      # - TVDB_API=https://api4.thetvdb.com/v4
      # - TVDB_TIMEOUT=5
      # - TVDB_TOKEN_FILE=/data/cache/tvdb_token.json
      # - TVDB_CACHE_FILE=/data/cache/tvdb.json
      # - TVDB_CACHE_TTL=604800

  # GVS PO token provider for SABR-restricted videos (see README). Bundled
  # deno/yt-dlp-ejs make this the default so high-res formats are unlocked.
  # Disable by removing it and clearing YT_QBT_POT_PROVIDER/POT_PROVIDER above.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider
    container_name: bgutil-provider
    restart: unless-stopped
    ports:
      - "4416:4416"

volumes:
  yt-indexarr-data:
